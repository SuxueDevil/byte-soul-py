[project]
name = "bytesoul"
version = "0.1.0"
description = "A FastAPI demo with controller-service-pojo structure"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "asyncmy>=0.2.11",
    "langgraph>=1.2.4",
    "langchain[community]>=1.3.8",
    "langchain-core>=1.4.6",
    "langchain-openai>=1.3.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-checkpoint-postgres>=3.0.5",
    "aiosqlite>=0.20.0",
    "loguru>=0.7.3",
    "psycopg-binary>=3.3.4",
    # RAG 依赖
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "rank-bm25>=0.2",
    "jieba>=0.42",
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11",
    "tiktoken>=0.7",
]

[tool.uv]
dev-dependencies = []
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
