[project]
name = "bytesoul"
version = "0.1.0"
description = "FastAPI + LangGraph RAG 助手"
requires-python = ">=3.10"

dependencies = [
    # Web 框架
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "httpx==0.28.1",
    "python-multipart>=0.0.27",

    # 数据层
    "pydantic==2.13.3",
    "pydantic-settings==2.14.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.49",
    "asyncmy==0.2.11",
    "psycopg-binary==3.3.4",

    # LangChain 生态
    "langchain[community]==1.3.8",
    "langchain-core==1.4.6",
    "langchain-openai==1.3.0",

    # Agent
    "langgraph==1.2.4",
    "langgraph-checkpoint-sqlite==3.0.3",
    "langgraph-checkpoint-postgres==3.0.5",
    "aiosqlite==0.22.1",

    # 工具
    "loguru==0.7.3",

    # RAG - 文档处理
    "langchain-text-splitters==1.1.2",
    "pdfplumber==0.11.9",
    "tiktoken==0.12.0",

    # RAG - 向量存储
    "langchain-chroma==1.1.0",
    "pymilvus==3.0.0",

    # RAG - 检索
    "elasticsearch==8.17.2",
    "rank-bm25==0.2.2",
    "jieba==0.42.1",

    # RAG - 重排序
    "sentence-transformers==5.5.1",
]

[tool.uv]
dev-dependencies = []
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
