[project]
name = "api-demo"
version = "0.1.0"
description = "A FastAPI demo with controller-service-pojo structure"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "asyncmy>=0.2.11",
    "langgraph>=1.1.10",
    "langchain>=1.2.17",
    "langchain-openai>=1.2.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-checkpoint-postgres>=3.0.5",
    "aiosqlite>=0.20.0",
    "loguru>=0.7.3",
    "psycopg-binary>=3.3.4",
]

[tool.uv]
dev-dependencies = []
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
